<svg class="logo-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="36" height="36" aria-hidden="true" xmlns:xlink="http://www.w3.org/1999/xlink">
        <defs>
          <filter id="hg" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="b1"></feGaussianBlur>
            <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b2"></feGaussianBlur>
            <feMerge><feMergeNode in="b2"></feMergeNode><feMergeNode in="b1"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
          </filter>
          <filter id="hc" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="b1"></feGaussianBlur>
            <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b2"></feGaussianBlur>
            <feMerge><feMergeNode in="b2"></feMergeNode><feMergeNode in="b1"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
          </filter>
        </defs>
        <!-- Tunnel lines -->
        <g filter="url(#hc)">
          <line x1="13" y1="14" x2="20" y2="26" stroke="#00CCFF" stroke-width="1.1px" opacity="0.90"></line>
          <line x1="27" y1="14" x2="20" y2="26" stroke="#00CCFF" stroke-width="1.1px" opacity="0.90"></line>
          <line x1="15" y1="17" x2="25" y2="17" stroke="#00CCFF" stroke-width="0.9px" opacity="0.80"></line>
          <line x1="17" y1="20" x2="23" y2="20" stroke="#00CCFF" stroke-width="0.7px" opacity="0.65"></line>
          <line x1="10" y1="35" x2="20" y2="26" stroke="#00CCFF" stroke-width="0.8px" opacity="0.45"></line>
          <line x1="30" y1="35" x2="20" y2="26" stroke="#00CCFF" stroke-width="0.8px" opacity="0.45"></line>
        </g>
        <!-- VP dot -->
        <circle cx="20" cy="26" r="1.5" fill="#FFFFFF"></circle>
        <!-- Kasagi (top beam) -->
        <polygon points="4,10 6.5,6 8.5,5 31.5,5 33.5,6 36,10  36,12 33.5,8 31.5,7 8.5,7 6.5,8 4,12" fill="#FF0055" filter="url(#hg)"></polygon>
        <!-- Nuki (lower beam) -->
        <rect x="11" y="13" width="18" height="1.5" rx="0.5" fill="#FF0055" filter="url(#hg)"></rect>
        <!-- Pillars -->
        <rect x="11" y="14.5" width="2.5" height="20" rx="0.5" fill="#FF0055" filter="url(#hg)"></rect>
        <rect x="26.5" y="14.5" width="2.5" height="20" rx="0.5" fill="#FF0055" filter="url(#hg)"></rect>
      </svg>