          type: string
          description: |-
            Maximum period for Atom holders to deposit on a proposal. Initial value: 2
            months.
      description: DepositParams defines the params for deposits on governance proposals.
    cosmos.gov.v1beta1.Proposal:
      type: object
      properties:
        proposal_id:
          type: string
          format: uint64
          description: proposal_id defines the unique id of the proposal.
        content:
          $ref: '#/components/schemas/google.protobuf.Any'
        status:
          $ref: '#/components/schemas/cosmos.gov.v1beta1.ProposalStatus'
        final_tally_result:
          $ref: '#/components/schemas/cosmos.gov.v1beta1.TallyResult'
        submit_time:
          type: string
          format: date-time
          description: submit_time is the time of proposal submission.
        deposit_end_time:
          type: string
          format: date-time
          description: deposit_end_time is the end time for deposition.
        total_deposit:
          type: array
          items:
            $ref: '#/components/schemas/cosmos.base.v1beta1.Coin'
          description: total_deposit is the total deposit on the proposal.
        voting_start_time:
          type: string
          format: date-time
          description: voting_start_time is the starting time to vote on a proposal.
        voting_end_time:
          type: string
          format: date-time
          description: voting_end_time is the end time of voting on a proposal.
      description: Proposal defines the core field members of a governance proposal.
    cosmos.gov.v1beta1.ProposalStatus:
      type: string
      enum:
      - PROPOSAL_STATUS_UNSPECIFIED
      - PROPOSAL_STATUS_DEPOSIT_PERIOD
      - PROPOSAL_STATUS_VOTING_PERIOD
      - PROPOSAL_STATUS_PASSED
      - PROPOSAL_STATUS_REJECTED
      - PROPOSAL_STATUS_FAILED
      default: PROPOSAL_STATUS_UNSPECIFIED
      description: |-
        ProposalStatus enumerates the valid statuses of a proposal.

         - PROPOSAL_STATUS_UNSPECIFIED: PROPOSAL_STATUS_UNSPECIFIED defines the default proposal status.
         - PROPOSAL_STATUS_DEPOSIT_PERIOD: PROPOSAL_STATUS_DEPOSIT_PERIOD defines a proposal status during the deposit
        period.
         - PROPOSAL_STATUS_VOTING_PERIOD: PROPOSAL_STATUS_VOTING_PERIOD defines a proposal status during the voting
        period.
         - PROPOSAL_STATUS_PASSED: PROPOSAL_STATUS_PASSED defines a proposal status of a proposal that has
        passed.
         - PROPOSAL_STATUS_REJECTED: PROPOSAL_STATUS_REJECTED defines a proposal status of a proposal that has
        been rejected.
         - PROPOSAL_STATUS_FAILED: PROPOSAL_STATUS_FAILED defines a proposal status of a proposal that has
        failed.
    cosmos.gov.v1beta1.QueryDepositResponse:
      type: object
