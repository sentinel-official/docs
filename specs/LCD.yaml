          format: int64
          title: |-
            This sets the maximum size of total evidence in bytes that can be committed in a single block.
            and should fall comfortably under the max block bytes.
            Default is 1048576 or 1MB
      description: EvidenceParams determine how we handle evidence of malfeasance.
    tendermint.types.Header:
      type: object
      properties:
        version:
          $ref: '#/components/schemas/tendermint.version.Consensus'
        chain_id:
          type: string
        height:
          type: string
          format: int64
        time:
          type: string
          format: date-time
        last_block_id:
          $ref: '#/components/schemas/tendermint.types.BlockID'
        last_commit_hash:
          type: string
          format: byte
          description: commit from validators from the last block
          title: hashes of block data
        data_hash:
          type: string
          format: byte
          title: transactions
        validators_hash:
          type: string
          format: byte
          description: validators for the current block
          title: hashes from the app output from the prev block
        next_validators_hash:
          type: string
          format: byte
          title: validators for the next block
        consensus_hash:
          type: string
          format: byte
          title: consensus params for current block
        app_hash:
          type: string
          format: byte
          title: state after txs from the previous block
        last_results_hash:
          type: string
          format: byte
          title: root hash of all results from the txs from the previous block
        evidence_hash:
          type: string
          format: byte
          description: evidence included in the block
          title: consensus info
        proposer_address:
          type: string
          format: byte
          title: original proposer of the block
      description: Header defines the structure of a block header.
    tendermint.types.LightBlock:
      type: object
      properties:
        signed_header:
          $ref: '#/components/schemas/tendermint.types.SignedHeader'
        validator_set:
          $ref: '#/components/schemas/tendermint.types.ValidatorSet'
    tendermint.types.LightClientAttackEvidence:
      type: object
      properties:
        conflicting_block:
          $ref: '#/components/schemas/tendermint.types.LightBlock'
        common_height:
          type: string
          format: int64
        byzantine_validators:
          type: array
          items:
            $ref: '#/components/schemas/tendermint.types.Validator'
        total_voting_power:
          type: string
          format: int64
        timestamp:
          type: string
          format: date-time
      description: LightClientAttackEvidence contains evidence of a set of validators attempting to mislead
        a light client.
    tendermint.types.PartSetHeader:
      type: object
      properties:
        total:
          type: integer
          format: int64
        hash:
          type: string
          format: byte
      title: PartsetHeader
    tendermint.types.SignedHeader:
      type: object
      properties:
        header:
          $ref: '#/components/schemas/tendermint.types.Header'
        commit:
          $ref: '#/components/schemas/tendermint.types.Commit'
    tendermint.types.SignedMsgType:
      type: string
      enum:
      - SIGNED_MSG_TYPE_UNKNOWN
      - SIGNED_MSG_TYPE_PREVOTE
      - SIGNED_MSG_TYPE_PRECOMMIT
      - SIGNED_MSG_TYPE_PROPOSAL
      default: SIGNED_MSG_TYPE_UNKNOWN
      description: |-
        SignedMsgType is a type of signed message in the consensus.

         - SIGNED_MSG_TYPE_PREVOTE: Votes
         - SIGNED_MSG_TYPE_PROPOSAL: Proposals
    tendermint.types.Validator:
      type: object
      properties:
        address:
          type: string
          format: byte
        pub_key:
          $ref: '#/components/schemas/tendermint.crypto.PublicKey'
        voting_power:
          type: string
          format: int64
        proposer_priority:
          type: string
          format: int64
    tendermint.types.ValidatorParams:
      type: object
      properties:
        pub_key_types:
          type: array
          items:
            type: string
      description: |-
        ValidatorParams restrict the public key types validators can use.
        NOTE: uses ABCI pubkey naming, not Amino names.
    tendermint.types.ValidatorSet:
      type: object
      properties:
        validators:
          type: array
          items:
            $ref: '#/components/schemas/tendermint.types.Validator'
        proposer:
          $ref: '#/components/schemas/tendermint.types.Validator'
        total_voting_power:
          type: string
          format: int64
    tendermint.types.VersionParams:
      type: object
      properties:
        app:
          type: string
          format: uint64
      description: VersionParams contains the ABCI application version.
    tendermint.types.Vote:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/tendermint.types.SignedMsgType'
        height:
          type: string
          format: int64
        round:
          type: integer
          format: int32
        block_id:
          $ref: '#/components/schemas/tendermint.types.BlockID'
        timestamp:
          type: string
          format: date-time
        validator_address:
          type: string
          format: byte
        validator_index:
          type: integer
          format: int32
        signature:
          type: string
          format: byte
      description: |-
        Vote represents a prevote, precommit, or commit vote from validators for
        consensus.
    tendermint.version.Consensus:
      type: object
      properties:
        block:
          type: string
          format: uint64
        app:
          type: string
          format: uint64
      description: |-
        Consensus captures the consensus rules for processing a block in the blockchain,
        including all blockchain data structures and the rules of the application's
        state transition machine.
