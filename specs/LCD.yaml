    cosmos.staking.v1beta1.Validator:
      type: object
      properties:
        operator_address:
          type: string
          description: operator_address defines the address of the validator's operator; bech encoded
            in JSON.
        consensus_pubkey:
          $ref: '#/components/schemas/google.protobuf.Any'
        jailed:
          type: boolean
          description: jailed defined whether the validator has been jailed from bonded status or not.
        status:
          $ref: '#/components/schemas/cosmos.staking.v1beta1.BondStatus'
        tokens:
          type: string
          description: tokens define the delegated tokens (incl. self-delegation).
        delegator_shares:
          type: string
          description: delegator_shares defines total shares issued to a validator's delegators.
        description:
          $ref: '#/components/schemas/cosmos.staking.v1beta1.Description'
        unbonding_height:
          type: string
          format: int64
          description: unbonding_height defines, if unbonding, the height at which this validator has
            begun unbonding.
        unbonding_time:
          type: string
          format: date-time
          description: unbonding_time defines, if unbonding, the min time for the validator to complete
            unbonding.
        commission:
          $ref: '#/components/schemas/cosmos.staking.v1beta1.Commission'
        min_self_delegation:
          type: string
          description: |-
            min_self_delegation is the validator's self declared minimum self delegation.

            Since: cosmos-sdk 0.46
        unbonding_on_hold_ref_count:
          type: string
          format: int64
          title: strictly positive if this validator's unbonding has been stopped by external modules
        unbonding_ids:
          type: array
          items:
            type: string
            format: uint64
          title: list of unbonding ids, each uniquely identifing an unbonding of this validator
      description: |-
        Validator defines a validator, together with the total amount of the
        Validator's bond shares and their exchange rate to coins. Slashing results in
        a decrease in the exchange rate, allowing correct calculation of future
        undelegations without iterating over delegators. When coins are delegated to
        this validator, the validator is credited with a delegation whose number of
        bond shares is based on the amount of coins delegated divided by the current
        exchange rate. Voting power can be calculated as total bonded shares
        multiplied by exchange rate.
    cosmos.tx.signing.v1beta1.SignMode:
      type: string
      enum:
      - SIGN_MODE_UNSPECIFIED
      - SIGN_MODE_DIRECT
      - SIGN_MODE_TEXTUAL
      - SIGN_MODE_DIRECT_AUX
      - SIGN_MODE_LEGACY_AMINO_JSON
      - SIGN_MODE_EIP_191
      default: SIGN_MODE_UNSPECIFIED
      description: |-
        SignMode represents a signing mode with its own security guarantees.

        This enum should be considered a registry of all known sign modes
        in the Cosmos ecosystem. Apps are not expected to support all known
        sign modes. Apps that would like to support custom  sign modes are
        encouraged to open a small PR against this file to add a new case
        to this SignMode enum describing their sign mode so that different
        apps have a consistent version of this enum.

         - SIGN_MODE_UNSPECIFIED: SIGN_MODE_UNSPECIFIED specifies an unknown signing mode and will be
        rejected.
         - SIGN_MODE_DIRECT: SIGN_MODE_DIRECT specifies a signing mode which uses SignDoc and is
        verified with raw bytes from Tx.
         - SIGN_MODE_TEXTUAL: SIGN_MODE_TEXTUAL is a future signing mode that will verify some
        human-readable textual representation on top of the binary representation
        from SIGN_MODE_DIRECT. It is currently not supported.
         - SIGN_MODE_DIRECT_AUX: SIGN_MODE_DIRECT_AUX specifies a signing mode which uses
        SignDocDirectAux. As opposed to SIGN_MODE_DIRECT, this sign mode does not
        require signers signing over other signers' `signer_info`. It also allows
        for adding Tips in transactions.

        Since: cosmos-sdk 0.46
         - SIGN_MODE_LEGACY_AMINO_JSON: SIGN_MODE_LEGACY_AMINO_JSON is a backwards compatibility mode which uses
        Amino JSON and will be removed in the future.
         - SIGN_MODE_EIP_191: SIGN_MODE_EIP_191 specifies the sign mode for EIP 191 signing on the Cosmos
        SDK. Ref: https://eips.ethereum.org/EIPS/eip-191

        Currently, SIGN_MODE_EIP_191 is registered as a SignMode enum variant,
        but is not implemented on the SDK by default. To enable EIP-191, you need
        to pass a custom `TxConfig` that has an implementation of
        `SignModeHandler` for EIP-191. The SDK may decide to fully support
        EIP-191 in the future.

        Since: cosmos-sdk 0.45.2
    cosmos.tx.v1beta1.AuthInfo:
      type: object
      properties:
        signer_infos:
          type: array
          items:
            $ref: '#/components/schemas/cosmos.tx.v1beta1.SignerInfo'
          description: |-
            signer_infos defines the signing modes for the required signers. The number
            and order of elements must match the required signers from TxBody's
            messages. The first element is the primary signer and the one which pays
            the fee.
        fee:
          $ref: '#/components/schemas/cosmos.tx.v1beta1.Fee'
        tip:
          $ref: '#/components/schemas/cosmos.tx.v1beta1.Tip'
      description: |-
        AuthInfo describes the fee and signer modes that are used to sign a
        transaction.
    cosmos.tx.v1beta1.BroadcastMode:
      type: string
      enum:
      - BROADCAST_MODE_UNSPECIFIED
      - BROADCAST_MODE_BLOCK
      - BROADCAST_MODE_SYNC
      - BROADCAST_MODE_ASYNC
      default: BROADCAST_MODE_UNSPECIFIED
      description: |-
        BroadcastMode specifies the broadcast mode for the TxService.Broadcast RPC method.

         - BROADCAST_MODE_UNSPECIFIED: zero-value for mode ordering
         - BROADCAST_MODE_BLOCK: DEPRECATED: use BROADCAST_MODE_SYNC instead,
        BROADCAST_MODE_BLOCK is not supported by the SDK from v0.47.x onwards.
         - BROADCAST_MODE_SYNC: BROADCAST_MODE_SYNC defines a tx broadcasting mode where the client waits for
        a CheckTx execution response only.
         - BROADCAST_MODE_ASYNC: BROADCAST_MODE_ASYNC defines a tx broadcasting mode where the client returns
        immediately.
    cosmos.tx.v1beta1.BroadcastTxRequest:
      type: object
      properties:
        tx_bytes:
          type: string
          format: byte
          description: tx_bytes is the raw transaction.
        mode:
          $ref: '#/components/schemas/cosmos.tx.v1beta1.BroadcastMode'
      description: |-
        BroadcastTxRequest is the request type for the Service.BroadcastTxRequest
        RPC method.
    cosmos.tx.v1beta1.BroadcastTxResponse:
      type: object
      properties:
        tx_response:
          $ref: '#/components/schemas/cosmos.base.abci.v1beta1.TxResponse'
      description: |-
        BroadcastTxResponse is the response type for the
        Service.BroadcastTx method.
    cosmos.tx.v1beta1.Fee:
      type: object
      properties:
        amount:
          type: array
          items:
            $ref: '#/components/schemas/cosmos.base.v1beta1.Coin'
          title: amount is the amount of coins to be paid as a fee
        gas_limit:
          type: string
          format: uint64
          title: |-
            gas_limit is the maximum gas that can be used in transaction processing
            before an out of gas error occurs
        payer:
          type: string
          description: |-
            if unset, the first signer is responsible for paying the fees. If set, the specified account must pay the fees.
            the payer must be a tx signer (and thus have signed this field in AuthInfo).
            setting this field does *not* change the ordering of required signers for the transaction.
        granter:
          type: string
          title: |-
            if set, the fee payer (either the first signer or the value of the payer field) requests that a fee grant be used
            to pay fees instead of the fee payer's own balance. If an appropriate fee grant does not exist or the chain does
            not support fee grants, this will fail
      description: |-
        Fee includes the amount of coins paid in fees and the maximum
        gas to be used by the transaction. The ratio yields an effective "gasprice",
        which must be above some miminum to be accepted into the mempool.
    cosmos.tx.v1beta1.GetBlockWithTxsResponse:
