openapi: 3.0.0
info:
  title: Sentinel LCD API
  description: |
    REST (LCD) API for the Sentinel Hub, served by the gRPC-gateway of `sentinelhub`
    **v12.0.2** (Cosmos SDK v0.47.17, IBC-go v7, CosmWasm) on chain `sentinelhub-2`.

    Every route in this document was generated from the v12.0.2 Protobuf definitions and
    then verified against the public endpoint, so the spec lists only routes the chain
    actually serves.

    ## Notes on the Sentinel modules

    * Sentinel query services are **version-namespaced** (`/sentinel/node/v3/...`). The
      older unversioned paths (`/sentinel/nodes`, `/sentinel/modules/node/params`, ...)
      no longer exist.
    * `node`, `session` and `subscription` are served at **v3**; `deposit`, `lease`,
      `oracle` and `swap` at **v1**.
    * A few **v2** provider and subscription routes remain live and are marked
      deprecated. The remaining v1/v2 query services were removed in v12 and return
      `501 Not Implemented`.
    * The **plan v3** and **provider v3** query services exist over gRPC but their
      gateway routes are not registered in v12.0.2, so they have **no REST equivalent**.
      Query them over gRPC instead.

    ## Querying historical state

    Pass the `x-cosmos-block-height` header to read state at a past height:

    ```bash
    curl -H "x-cosmos-block-height: 30000000" \
        https://lcd.sentinel.co/cosmos/bank/v1beta1/balances/<address>
    ```
  version: 12.0.2
  contact:
    name: Sentinel
    url: https://github.com/sentinel-official/hub/issues
  license:
    name: Apache 2.0
    url: https://github.com/sentinel-official/hub/blob/master/LICENSE
servers:
- url: https://lcd.sentinel.co
  description: Sentinel Hub mainnet (sentinelhub-2)
- url: http://localhost:1317
  description: Local node, with api.enable = true in app.toml
tags:
- name: Sentinel · Nodes
  description: dVPN node registration, status and parameters (node v3).
- name: Sentinel · Sessions
  description: Active and historical dVPN session queries (session v3).
- name: Sentinel · Subscriptions
  description: Subscriptions and allocations (subscription v3, with live v2 allocation routes).
- name: Sentinel · Providers
  description: dVPN service provider registry (provider v2).
- name: Sentinel · Deposits
  description: Module deposit balances held for accounts.
- name: Sentinel · Leases
  description: Node leases taken out by providers (module added in v12).
- name: Sentinel · Oracle
  description: On-chain asset price feeds (module added in v12).
- name: Sentinel · Swaps
  description: Legacy ERC-20 to native token swap records.
- name: Auth
  description: Accounts, account metadata and bech32 helpers.
- name: Authz
  description: Authorization grants between accounts.
- name: Bank
  description: Token balances, supply, and denom metadata.
- name: Base
  description: Node and CometBFT base queries (blocks, validator sets, node config).
- name: Consensus
  description: Consensus parameters.
- name: Distribution
  description: Staking reward distribution, commission and community pool.
- name: Evidence
  description: Evidence of validator misbehaviour.
- name: Feegrant
  description: Fee allowances granted between accounts.
- name: Governance
  description: Proposals, deposits, votes and tallies (v1 and v1beta1).
- name: Group
  description: On-chain groups, group policies and group proposals.
- name: Mint
  description: Inflation and minting parameters.
- name: NFT
  description: NFT classes, ownership and balances.
- name: Params
  description: Legacy module parameter subspace queries.
- name: Slashing
  description: Validator signing info and slashing parameters.
- name: Staking
  description: Validators, delegations, redelegations and the bonding pool.
- name: Transactions
  description: Transaction broadcast, simulation, encoding and search.
- name: Upgrade
  description: Scheduled chain upgrades and module versions.
- name: IBC · Core
  description: IBC clients, connections and channels.
- name: IBC · Transfer
  description: ICS-20 fungible token transfer.
- name: IBC · Interchain Accounts
  description: ICS-27 interchain accounts (host and controller).
- name: CosmWasm
  description: Smart contract codes, instances and state.
