  /cosmos/auth/v1beta1/account_info/{address}:
    get:
      summary: Account Info
      description: 'Since: cosmos-sdk 0.47'
      operationId: cosmos_auth_v1beta1_QueryAccountInfo
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cosmos.auth.v1beta1.QueryAccountInfoResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: address
        description: address is the account address string.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Auth
  /cosmos/auth/v1beta1/accounts:
    get:
      summary: Accounts
      description: |-
        When called from another module, this query might consume a high amount of
        gas if the pagination field is incorrectly set.

        Since: cosmos-sdk 0.43
      operationId: cosmos_auth_v1beta1_QueryAccounts
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cosmos.auth.v1beta1.QueryAccountsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: pagination.key
        description: |-
          key is a value returned in PageResponse.next_key to begin
          querying the next page most efficiently. Only one of offset or key
          should be set.
        in: query
        required: false
        schema:
          type: string
          format: byte
      - name: pagination.offset
        description: |-
          offset is a numeric offset that can be used when key is unavailable.
          It is less efficient than using key. Only one of offset or key should
          be set.
        in: query
        required: false
        schema:
          type: string
          format: uint64
      - name: pagination.limit
        description: |-
          limit is the total number of results to be returned in the result page.
          If left empty it will default to a value to be set by each app.
        in: query
        required: false
        schema:
          type: string
          format: uint64
      - name: pagination.count_total
        description: |-
          count_total is set to true  to indicate that the result set should include
          a count of the total number of items available for pagination in UIs.
          count_total is only respected when offset is used. It is ignored when key
          is set.
        in: query
        required: false
        schema:
          type: boolean
      - name: pagination.reverse
        description: |-
          reverse is set to true if results are to be returned in the descending order.

          Since: cosmos-sdk 0.43
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Auth
